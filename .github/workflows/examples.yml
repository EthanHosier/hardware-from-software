name: Verify examples
on:
  workflow_dispatch:
  push:
    paths: ['examples/**', 'scripts/test_serial.py', 'scripts/build_pi_kernel.py', 'scripts/install_pi_kernel.py', 'scripts/test_pi_kernel_install.py', 'kernel-baseline.json', '.github/workflows/examples.yml']
permissions:
  contents: read
jobs:
  linux-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_examples.py --host --linux
      - run: python3 scripts/test_serial.py
      - run: .build/memory_lab
      - run: python3 scripts/test_pi_kernel_install.py
  arm64-userspace:
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y build-essential python3
      - run: python3 scripts/build_examples.py --host --linux
      - run: python3 scripts/test_serial.py
      - run: .build/memory_lab
  pi-kernel-build:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned-distribution cross-build tools
        run: apt-get update && apt-get install -y build-essential gcc-aarch64-linux-gnu git bc bison flex libssl-dev libelf-dev dwarves python3 device-tree-compiler kmod xz-utils ca-certificates
      - name: Build complete course kernel, modules and Device Trees
        run: python3 scripts/build_pi_kernel.py --cross-compile=aarch64-linux-gnu- --jobs 4
      - name: Stage complete matching module installation
        run: |
          make -C .build/pi-kernel/source O="$PWD/.build/pi-kernel/output" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LOCALVERSION= INSTALL_MOD_PATH="$PWD/.build/pi-kernel/staged" modules_install
          du -sh .build/pi-kernel/output .build/pi-kernel/staged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi-single-kernel-evidence
          include-hidden-files: true
          path: |
            .build/pi-kernel/build-report.json
            .build/pi-kernel/config-diff.json
            .build/pi-kernel/output/.config
            .build/pi-kernel/output/Module.symvers
            .build/pi-kernel/output/arch/arm64/boot/Image
            .build/pi-kernel/output/arch/arm64/boot/dts/broadcom/bcm2711-rpi-4-b.dtb
            .build/pi-kernel/hardware-button.dtbo
            examples/kernel/*.ko
          retention-days: 30
