<text x="144" y="823" font-size="15">Pico 2</text>
<text x="334" y="672" font-size="23" font-weight="bold">Raspberry Pi Pico 2</text>
<text x="334" y="704">One Cortex-M33 runs our firmware.</text>
<text x="334" y="735">UART receive → parse command</text>
<text x="334" y="766">→ GPIO output register</text>
<text x="334" y="806" font-size="16">Non-wireless board; selected landmarks only.</text>
