<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-labelledby="title desc">
<title id="title">Adafruit BME280 product 2652: QT breakout orientation and roles</title>
<desc id="desc">Simplified component-side top view, header at bottom. VIN, 3Vo, GND, SCK, SDO, SDI and CS go left to right. The central sensor is distinct from the regulator to its left and signal support circuits to its right. Two QT sockets sit at the sides, and mounting holes at the top corners. ADDR jumper is on the reverse, not visible. A lower conceptual panel shows power conditioning and interface circuitry between the header and sensor.</desc>
