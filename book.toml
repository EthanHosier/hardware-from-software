[book]
title = "Hardware from Software"
description = "A hands-on guide to Pico 2, Raspberry Pi 4, registers, interrupts, buses and Linux drivers."
language = "en"
src = "src"
[build]
build-dir = "book"
[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true
additional-css = ["src/assets/book.css"]
[output.html.playground]
runnable = false
[output.html.search]
enable = true
