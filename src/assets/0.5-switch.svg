<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" role="img"><title>0.5-switch.svg</title><style>text{font-family:Arial,sans-serif;fill:#172b46;font-size:18px}.title{font-size:24px;font-weight:bold}.small{font-size:15px}.label{font-weight:bold} .wire{fill:none;stroke:#546777;stroke-width:4}</style><rect width="100%" height="100%" fill="#f7f9fc"/><text x="24" y="34" class="title">Four-leg tactile switch: contacts, then placement</text><text x="24" y="64" class="small">Reference: four-terminal Omron B3F form, rotated for this drawing.</text><text x="24" y="105" class="label">Top view: two pairs, not four independent signals</text><rect x="155" y="139" width="230" height="170" rx="10" fill="#414c58"/><circle cx="270" cy="223" r="48" fill="#aeb8c1"/><path d="M113 167 L429 167" stroke="#ca8b25" stroke-width="7" fill="none"/><circle cx="113" cy="167" r="8" fill="#ca8b25"/><circle cx="429" cy="167" r="8" fill="#ca8b25"/><text x="58" y="173" class="">A1</text><text x="447" y="173" class="">A2</text><path d="M113 281 L429 281" stroke="#248979" stroke-width="7" fill="none"/><circle cx="113" cy="281" r="8" fill="#248979"/><circle cx="429" cy="281" r="8" fill="#248979"/><text x="58" y="287" class="">B1</text><text x="447" y="287" class="">B2</text><text x="515" y="161" class="">A1 ↔ A2: always joined</text><text x="515" y="199" class="">B1 ↔ B2: always joined</text><text x="515" y="247" class="">Released: A separate from B</text><text x="515" y="285" class="">Pressed: A joins B</text><text x="24" y="352" class="small">A/B names are local labels, not manufacturer terminal numbers.</text><text x="24" y="397" class="label">Fit across the centre gap; keep the two pairs on different rows</text><rect x="40" y="420" width="450" height="290" rx="12" fill="white" stroke="#aab5c1"/><rect x="246" y="431" width="32" height="267" fill="#d9e1ea"/><path d="M84 463 L220 463" stroke="#edd7ae" stroke-width="14" fill="none"/><path d="M304 463 L440 463" stroke="#b7dcd7" stroke-width="14" fill="none"/><circle cx="84" cy="463" r="4" fill="#536479"/><circle cx="118" cy="463" r="4" fill="#536479"/><circle cx="152" cy="463" r="4" fill="#536479"/><circle cx="186" cy="463" r="4" fill="#536479"/><circle cx="220" cy="463" r="4" fill="#536479"/><circle cx="304" cy="463" r="4" fill="#536479"/><circle cx="338" cy="463" r="4" fill="#536479"/><circle cx="372" cy="463" r="4" fill="#536479"/><circle cx="406" cy="463" r="4" fill="#536479"/><circle cx="440" cy="463" r="4" fill="#536479"/><path d="M84 509 L220 509" stroke="#edd7ae" stroke-width="14" fill="none"/><path d="M304 509 L440 509" stroke="#b7dcd7" stroke-width="14" fill="none"/><circle cx="84" cy="509" r="4" fill="#536479"/><circle cx="118" cy="509" r="4" fill="#536479"/><circle cx="152" cy="509" r="4" fill="#536479"/><circle cx="186" cy="509" r="4" fill="#536479"/><circle cx="220" cy="509" r="4" fill="#536479"/><circle cx="304" cy="509" r="4" fill="#536479"/><circle cx="338" cy="509" r="4" fill="#536479"/><circle cx="372" cy="509" r="4" fill="#536479"/><circle cx="406" cy="509" r="4" fill="#536479"/><circle cx="440" cy="509" r="4" fill="#536479"/><path d="M84 555 L220 555" stroke="#edd7ae" stroke-width="14" fill="none"/><path d="M304 555 L440 555" stroke="#b7dcd7" stroke-width="14" fill="none"/><circle cx="84" cy="555" r="4" fill="#536479"/><circle cx="118" cy="555" r="4" fill="#536479"/><circle cx="152" cy="555" r="4" fill="#536479"/><circle cx="186" cy="555" r="4" fill="#536479"/><circle cx="220" cy="555" r="4" fill="#536479"/><circle cx="304" cy="555" r="4" fill="#536479"/><circle cx="338" cy="555" r="4" fill="#536479"/><circle cx="372" cy="555" r="4" fill="#536479"/><circle cx="406" cy="555" r="4" fill="#536479"/><circle cx="440" cy="555" r="4" fill="#536479"/><path d="M84 601 L220 601" stroke="#edd7ae" stroke-width="14" fill="none"/><path d="M304 601 L440 601" stroke="#b7dcd7" stroke-width="14" fill="none"/><circle cx="84" cy="601" r="4" fill="#536479"/><circle cx="118" cy="601" r="4" fill="#536479"/><circle cx="152" cy="601" r="4" fill="#536479"/><circle cx="186" cy="601" r="4" fill="#536479"/><circle cx="220" cy="601" r="4" fill="#536479"/><circle cx="304" cy="601" r="4" fill="#536479"/><circle cx="338" cy="601" r="4" fill="#536479"/><circle cx="372" cy="601" r="4" fill="#536479"/><circle cx="406" cy="601" r="4" fill="#536479"/><circle cx="440" cy="601" r="4" fill="#536479"/><path d="M84 647 L220 647" stroke="#edd7ae" stroke-width="14" fill="none"/><path d="M304 647 L440 647" stroke="#b7dcd7" stroke-width="14" fill="none"/><circle cx="84" cy="647" r="4" fill="#536479"/><circle cx="118" cy="647" r="4" fill="#536479"/><circle cx="152" cy="647" r="4" fill="#536479"/><circle cx="186" cy="647" r="4" fill="#536479"/><circle cx="220" cy="647" r="4" fill="#536479"/><circle cx="304" cy="647" r="4" fill="#536479"/><circle cx="338" cy="647" r="4" fill="#536479"/><circle cx="372" cy="647" r="4" fill="#536479"/><circle cx="406" cy="647" r="4" fill="#536479"/><circle cx="440" cy="647" r="4" fill="#536479"/><rect x="202" y="483" width="120" height="144" rx="8" fill="#414c58"/><circle cx="262" cy="555" r="28" fill="#aeb8c1"/><path d="M186 509 L338 509" stroke="#ca8b25" stroke-width="6" fill="none"/><path d="M186 601 L338 601" stroke="#248979" stroke-width="6" fill="none"/><text x="128" y="496" class="small">A1</text><text x="352" y="496" class="small">A2</text><text x="128" y="628" class="small">B1</text><text x="352" y="628" class="small">B2</text><text x="520" y="470" class="">A row</text><text x="520" y="501" class="">One wire uses this node.</text><text x="520" y="594" class="">B row</text><text x="520" y="625" class="">Other wire uses this node.</text><text x="24" y="751" class="">Across-gap placement alone does not choose a switched pair.</text><text x="24" y="780" class="">Use one A and one B. A1 + A2 would be connected even when released.</text></svg>