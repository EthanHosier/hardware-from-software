<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 630" role="img" aria-labelledby="title desc">
<title id="title">GP17 edge to exception return</title><desc id="desc">Conceptual single-core flow. GPIO edge latches and enabled status request NVIC IRQ21. Vector37 selects gpio_isr. Hardware saves interrupted state. The ISR acknowledges the GPIO latch and notifies main. Exception return restores state or tail-chains to another pending handler.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#325b7a" stroke-width="2"/></marker></defs>
<rect width="840" height="630" rx="12" fill="#f6f8fc"/>
<g font-family="system-ui,sans-serif" fill="#17263b" text-anchor="middle">
<text x="420" y="36" font-size="23">Conceptual path inside RP2350 / Cortex-M33 core 0</text>
<g fill="white" stroke="#506b85" stroke-width="2"><rect x="130" y="60" width="580" height="66" rx="8"/><rect x="130" y="157" width="580" height="66" rx="8"/><rect x="130" y="254" width="580" height="78" rx="8"/><rect x="130" y="363" width="580" height="78" rx="8"/><rect x="130" y="472" width="580" height="78" rx="8"/></g>
<g font-size="19"><text x="420" y="87">GP17 transition → GPIO edge latch</text><text x="420" y="112">INTR2 → enabled status PROC0_INTS2</text><text x="420" y="184">NVIC IRQ21: pending → accepted / active</text><text x="420" y="209">Masks and priority determine eligibility</text><text x="420" y="281">Hardware stacking + vector entry 37</text><text x="420" y="307">Interrupted context saved; LR receives EXC_RETURN</text><text x="420" y="390">gpio_isr: read status → W1C acknowledgment</text><text x="420" y="416">Set changed when an enabled GP17 edge was seen</text><text x="420" y="499">bx lr initiates exception return</text><text x="420" y="525">Restore interrupted code, or tail-chain to another handler</text></g>
<text x="420" y="589" font-size="17">Main later consumes changed, debounces, updates GP16 and prints.</text><text x="420" y="614" font-size="16">Hardware frame and compiler prologue are separate mechanisms.</text>
</g><g stroke="#325b7a" stroke-width="2" marker-end="url(#arrow)"><path d="M420 127V153"/><path d="M420 224V250"/><path d="M420 333V359"/><path d="M420 442V468"/></g></svg>
