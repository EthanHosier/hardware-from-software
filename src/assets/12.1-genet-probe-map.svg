<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
<title id="title">GENET probe, mapped resources and PHY</title>
<desc id="desc">Device Tree selects the platform driver. Probe creates RAM software objects and maps controller resources. Descriptor slots are MMIO, while packet payloads are in RAM reached by DMA. MDIO manages the external PHY; RGMII transports packet data.</desc>
