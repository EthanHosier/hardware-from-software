<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
<title id="title">UDP stack path and numbered application bytes</title>
<desc id="desc">A sender submits eight bytes to UDP, IPv4 routing and neighbour lookup, then Ethernet. The recipient reverses the layers and queues a datagram for the endpoint. ARP resolves next-hop addresses separately. Physical Ethernet traverses MAC and PHY; veth is software only. A byte map shows eight-byte HFS version-one sequence-one payload and frame offsets for ordinary IPv4.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#376a96"/></marker></defs>
<rect width="960" height="700" rx="16" fill="#f5f8fc"/>
<g font-family="system-ui,sans-serif" fill="#19324c" text-anchor="middle">
<text x="480" y="34" font-size="23" font-weight="700">Application bytes travel inside protocol headers</text>
<text x="225" y="67" font-size="18" font-weight="700">Sender: transmit ↓</text><text x="735" y="67" font-size="18" font-weight="700">Receiver: receive ↑</text>
<g fill="#deecfa" stroke="#376a96" stroke-width="1.5"><rect x="45" y="82" width="360" height="50" rx="8"/><rect x="555" y="82" width="360" height="50" rx="8"/><rect x="45" y="157" width="360" height="50" rx="8"/><rect x="555" y="157" width="360" height="50" rx="8"/><rect x="45" y="232" width="360" height="64" rx="8"/><rect x="555" y="232" width="360" height="64" rx="8"/><rect x="45" y="321" width="360" height="50" rx="8"/><rect x="555" y="321" width="360" height="50" rx="8"/></g>
<g font-size="17"><text x="225" y="113">Python application: send 8 bytes</text><text x="735" y="113">C++ application: validate / echo</text><text x="225" y="188">UDP socket → add UDP header</text><text x="735" y="180">UDP → socket receive queue</text><text x="735" y="199" font-size="14">recvfrom returns one datagram</text><text x="225" y="257">IPv4 route → next-hop neighbour</text><text x="225" y="281" font-size="14">ARP resolves a missing MAC mapping</text><text x="735" y="258">IPv4 → local destination</text><text x="735" y="282" font-size="14">UDP port selects bound socket</text><text x="225" y="352">Ethernet: add link header</text><text x="735" y="352">Ethernet: receive frame</text></g>
<g stroke="#376a96" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M225 133V154"/><path d="M225 208V229"/><path d="M225 297V318"/><path d="M735 321V300"/><path d="M735 232V211"/><path d="M735 157V136"/><path d="M225 373V406H735V375"/></g>
<rect x="288" y="388" width="385" height="58" rx="8" fill="#e5f3e9" stroke="#477b58"/>
<text x="480" y="411" font-size="16">Physical link: driver / MAC / PHY / cable</text><text x="480" y="434" font-size="15">Private lab: veth software link, no PHY</text>
<text x="480" y="477" font-size="18" font-weight="700">Untagged Ethernet + IPv4 without options: byte offsets</text>
<g stroke="#376a96" fill="#deecfa"><rect x="45" y="494" width="230" height="49"/><rect x="275" y="494" width="260" height="49"/><rect x="535" y="494" width="180" height="49"/><rect x="715" y="494" width="200" height="49" fill="#e5f3e9"/></g>
<g font-size="15"><text x="160" y="515">Ethernet header</text><text x="160" y="535">0–13: 14 bytes</text><text x="405" y="515">IPv4 header</text><text x="405" y="535">14–33: 20 bytes</text><text x="625" y="515">UDP header</text><text x="625" y="535">34–41: 8 bytes</text><text x="815" y="515">Application payload</text><text x="815" y="535">42–49: 8 bytes</text></g>
<text x="480" y="575" font-size="17" font-weight="700">Payload sequence 1 (offsets relative to payload)</text>
<g font-family="monospace" font-size="21"><text x="480" y="610">48 46 53 | 01 | 00 00 00 01</text></g>
<text x="480" y="636" font-size="15">0–2: “HFS”       3: version       4–7: big-endian sequence</text>
<text x="480" y="672" font-size="14">Header widths above are schematic. ARP uses separate frames; replies follow the reverse path.</text>
</g></svg>
