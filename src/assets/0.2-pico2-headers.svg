<svg xmlns="http://www.w3.org/2000/svg" width="740" height="940" viewBox="0 0 740 940" role="img" aria-labelledby="t d"><title id="t">Pico 2 header close-up, top view USB up</title><desc id="d">Twenty header connections on each side. Physical numbering runs 1 through 20 down the left, 21 through 40 up the right. Every GPIO, power, control and ground connection is labelled.</desc><style>text{font-family:Arial,sans-serif;font-size:23px;fill:#20334a}.small{font-size:18px}.wire{stroke:#435568;stroke-width:2}.pad{fill:#e5c36b;stroke:#716037;stroke-width:2}</style><rect width="740" height="940" fill="white"/><text x="25" y="35" font-weight="bold">Header close-up — TOP VIEW, USB UP</text><text x="25" y="65" class="small">Numbers = physical board pins; GP names = GPIO signals</text><rect x="300" y="105" width="140" height="735" rx="12" fill="#16806e"/><rect x="337" y="90" width="66" height="50" fill="#ccd3d8" stroke="#435568"/><text x="342" y="122" class="small">USB</text><text x="350" y="530" fill="white" transform="rotate(-90 350 530)">Pico 2</text><rect x="302" y="146" width="16" height="18" rx="0" class="pad"/><circle cx="310" cy="155" r="3" fill="white"/><path d="M235 155H300" class="wire"/><text x="270" y="150" class="small">1</text><text x="90" y="162">GP0</text><rect x="422" y="146" width="16" height="18" rx="5" class="pad"/><circle cx="430" cy="155" r="3" fill="white"/><path d="M440 155H505" class="wire"/><text x="450" y="150" class="small">40</text><text x="525" y="162">VBUS</text><rect x="302" y="180" width="16" height="18" rx="5" class="pad"/><circle cx="310" cy="189" r="3" fill="white"/><path d="M235 189H300" class="wire"/><text x="270" y="184" class="small">2</text><text x="90" y="196">GP1</text><rect x="422" y="180" width="16" height="18" rx="5" class="pad"/><circle cx="430" cy="189" r="3" fill="white"/><path d="M440 189H505" class="wire"/><text x="450" y="184" class="small">39</text><text x="525" y="196">VSYS</text><rect x="302" y="214" width="16" height="18" rx="5" class="pad"/><circle cx="310" cy="223" r="3" fill="#20334a"/><path d="M235 223H300" class="wire"/><text x="270" y="218" class="small">3</text><text x="90" y="230">GND</text><rect x="422" y="214" width="16" height="18" rx="5" class="pad"/><circle cx="430" cy="223" r="3" fill="#20334a"/><path d="M440 223H505" class="wire"/><text x="450" y="218" class="small">38</text><text x="525" y="230">GND</text><rect x="302" y="248" width="16" height="18" rx="5" class="pad"/><circle cx="310" cy="257" r="3" fill="white"/><path d="M235 257H300" class="wire"/><text x="270" y="252" class="small">4</text><text x="90" y="264">GP2</text><rect x="422" y="248" width="16" height="18" rx="5" class="pad"/><circle cx="430" cy="257" r="3" fill="white"/><path d="M440 257H505" class="wire"/><text x="450" y="252" class="small">37</text><text x="525" y="264">3V3_EN</text><rect x="302" y="282" width="16" height="18" rx="5" class="pad"/><circle cx="310" cy="291" r="3" fill="white"/><path d="M235 291H300" class="wire"/><text x="270" y="286" class="small">5</text><text x="90" y="298">GP3</text><rect x="422" y="282" width="16" height="18" rx="5" class="pad"/><circle cx="430" cy="291" r="3" fill="white"/><path d="M440 291H505" class="wire"/><text x="450" y="286" class="small">36</text><text x="525" y="298">3V3(OUT)</text><rect x="302" y="316" width="16" height="18" rx="5" class="pad"/><circle cx="310" cy="325" r="3" fill="white"/><path d="M235 325H300" class="wire"/><text x="270" y="320" class="small">6</text><text x="90" y="332">GP4</text><rect x="422" y="316" width="16" height="18" rx="5" class="pad"/><circle cx="430" cy="325" r="3" fill="white"/><path d="M440 325H505" class="wire"/><text x="450" y="320" class="small">35</text><text x="525" y="332">ADC_VREF</text><rect x="302" y="350" width="16" height="18" rx="5" class="pad"/><circle cx="310" cy="359" r="3" fill="white"/><path d="M235 359H300" class="wire"/><text x="270" y="354" class="small">7</text><text x="90" y="366">GP5</text><rect x="42