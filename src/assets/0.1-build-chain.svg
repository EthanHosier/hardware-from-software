<circle cx="60" cy="353" r="3" fill="#ffe095"/>
<rect x="105" y="383" width="46" height="44" fill="#333f4b"/>
<text x="92" y="451" font-size="15">BCM2711</text>
<rect x="246" y="345" width="55" height="45" fill="#bac5cf" stroke="#344d68"/>
<rect x="257" y="401" width="44" height="40" fill="#bac5cf" stroke="#344d68"/>
<rect x="257" y="452" width="44" height="40" fill="#bac5cf" stroke="#344d68"/>
<text x="218" y="381" font-size="12">Ethernet</text>
<text x="218" y="431" font-size="12">USB</text>
<rect x="58" y="489" width="29" height="20" fill="#bac5cf" stroke="#344d68"/>
<text x="40" y="533" font-size="14">USB-C power (bottom-left edge)</text>
<text x="334" y="370" font-size="23" font-weight="bold">Raspberry Pi 4 Model B</text>
<text x="334" y="402">Cortex-A72 CPUs run Linux.</text>
<text x="334" y="433">C++ process → Linux UART driver</text>
<text x="334" y="464">→ UART controller in the SoC</text>
<path d="M170 550V605" fill="none" stroke="#344d68" stroke-width="3" marker-end="url(#arrow)"/>
<text x="205" y="572">UART: TX / RX signals + common GND</text>
<text x="205" y="596" font-size="15">Replies return in the opposite direction.</text>
