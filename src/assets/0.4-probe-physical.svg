<svg xmlns="http://www.w3.org/2000/svg" width="760" height="670" viewBox="0 0 760 670" role="img" aria-labelledby="t d">
<title id="t">Debug Probe physical top view and connector close-up</title><desc id="d">USB at top. UART U is lower left; debug D lower right. Both side-entry connectors face downward. Pin 1 is left, 2 centre, 3 right in this top view. U carries probe TX ground RX; D carries SWCLK ground SWDIO.</desc>
