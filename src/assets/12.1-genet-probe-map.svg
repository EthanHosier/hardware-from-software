<text x="45" y="87" font-weight="700">Device Tree</text><text x="45" y="114">compatible / reg / IRQs</text><text x="45" y="140">phy-handle / phy-mode</text>
<text x="367" y="88" font-weight="700">bcmgenet_probe</text><text x="367" y="116">match → allocate → map</text><text x="367" y="142">MDIO init → register</text>
<text x="668" y="88" font-weight="700">net_device (RAM)</text><text x="668" y="116">registered Linux interface</text><text x="668" y="142">open → PHY connection/start</text>
<text x="48" y="258" font-weight="700">Kernel software (RAM)</text><text x="48" y="288">priv / TX and RX control blocks</text><text x="48" y="318">priv-&gt;base: virtual MMIO pointer</text><text x="48" y="348">readl_relaxed / writel_relaxed</text>
<text x="518" y="258" font-weight="700">GENET controller MMIO resource</text><text x="518" y="288">MAC + DMA control registers</text><text x="518" y="318">Descriptor slots: addr + length/status</text><text x="518" y="348">dmadesc_set / register read helpers</text>
<text x="48" y="490" font-weight="700">Packet payload buffers (RAM)</text><text x="48" y="520">CPU accesses kernel virtual pointers</text><text x="48" y="550">DMA API supplies device DMA addresses</text><text x="48" y="580">Separate from MMIO descriptor pointers</text>
<text x="520" y="483" font-weight="700">External PHY</text><text x="520" y="511">link negotiation</text><text x="520" y="537">cable signalling</text>
<text x="790" y="487" font-weight="700">Magnetics</text><text x="790" y="515">RJ45 / cable</text><text x="790" y="541">LAN partner</text>
