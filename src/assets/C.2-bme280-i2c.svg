<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" role="img" aria-labelledby="title desc">
<title id="title">C.2: complete Pico to BME280 I2C electrical map</title><desc id="desc">Four wires: Pico 3V3 OUT physical36 to sensor VIN; ground8 to GND; GP4 physical6 to SDI SDA; GP5 physical7 to SCK SCL. CS SDO and 3Vo unconnected externally. Pi and probe detached. Logical connection drawing, not physical board layout.</desc>
<rect width="950" height="560" fill="#fafbfc"/><g font-family="sans-serif" fill="#14283e"><text x="30" y="36" font-size="24" font-weight="bold">Standalone Pico → Adafruit BME280 product 2652</text><text x="30" y="66" font-size="17">Electrical connection map • not physical header order • all wiring done unpowered</text>
<rect x="30" y="110" width="320" height="310" rx="12" fill="#e0f1e8" stroke="#246249" stroke-width="2"/><text x="52" y="143" font-size="22" font-weight="bold">Pico 2</text><text x="52" y="169" font-size="16">USB to Mac: power + CDC output</text>
<rect x="610" y="110" width="310" height="310" rx="12" fill="#e7e8f6" stroke="#544e88" stroke-width="2"/><text x="632" y="143" font-size="22" font-weight="bold">BME280 breakout</text><text x="632" y="169" font-size="16">Header names; QT sockets empty</text>
<g font-size="19"><text x="52" y="220">3V3(OUT) · physical 36</text><text x="52" y="270">GND · physical 8</text><text x="52" y="320">GP4 / SDA · physical 6</text><text x="52" y="370">GP5 / SCL · physical 7</text><text x="632" y="220">VIN</text><text x="632" y="270">GND</text><text x="632" y="320">SDI / SDA</text><text x="632" y="370">SCK / SCL</text></g>
<g stroke-width="4" fill="none"><path d="M350 214H610" stroke="#b24d34"/><path d="M350 264H610" stroke="#364451"/><path d="M350 314H610" stroke="#176d9b"/><path d="M350 364H610" stroke="#7160a7"/></g>
<g font-size="16"><text x="414" y="202">3.3 V supply</text><text x="435" y="252">return</text><text x="428" y="302">data</text><text x="423" y="352">clock</text></g>
<text x="30" y="456" font-size="18">CS: no external wire; board pull-up selects I²C.</text><text x="30" y="485" font-size="18">SDO: no wire; address 0x77. ADDR jumper open. 3Vo: output, unused.</text><text x="30" y="514" font-size="18">Powered breakout supplies bus pull-ups; Pico internal pulls disabled.</text><text x="30" y="543" font-size="18" font-weight="bold">Pi OFF and separate. No Pi–Pico, probe or SPI loopback wires.</text></g></svg>
