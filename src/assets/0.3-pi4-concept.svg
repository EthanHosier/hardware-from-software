<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img"><title>Pi 4 — conceptual organisation</title><desc>Conceptual diagram, not physical placement. CPU cores and peripheral controllers inside BCM2711; external RAM, USB host, Ethernet PHY and storage.</desc><style>text{font-family:system-ui,sans-serif;fill:#142c3a} .small{font-size:16px}.name{font-size:18px;font-weight:600}.part{stroke:#183e45;stroke-width:2}.num{fill:#fff;font-size:17px;font-weight:bold;text-anchor:middle}</style><rect width="920" height="560" fill="#f6fafb"/><text x="30" y="35" font-size="24" font-weight="bold">Pi 4 — conceptual organisation</text><rect x="40" y="85" width="520" height="330" rx="16" fill="#dae9f1" class="part"/><text x="65" y="120" class="name">Inside the BCM2711 SoC</text><rect x="70" y="145" width="210" height="85" rx="3" fill="#fff" class="part"/><text x="86" y="181" class="name">4 Cortex-A72 cores</text><text x="86" y="209" class="small">execute instructions</text><rect x="310" y="145" width="220" height="85" rx="3" fill="#fff" class="part"/><text x="330" y="181" class="name">VideoCore graphics</text><rect x="70" y="255" width="460" height="120" rx="3" fill="#fff" class="part"/><text x="90" y="285" class="name">Memory and peripheral controllers</text><text x="90" y="315" class="small">GPIO / UART / I²C · SD · Ethernet MAC</text><text x="90" y="346" class="small">PCIe connection to external USB controller</text><rect x="640" y="85" width="235" height="65" rx="3" fill="#d6e2e4" class="part"/><text x="657" y="123" class="name">External LPDDR4 RAM</text><rect x="640" y="180" width="235" height="65" rx="3" fill="#d6e2e4" class="part"/><text x="657" y="218" class="name">VL805 → USB ports</text><rect x="640" y="275" width="235" height="65" rx="3" fill="#d6e2e4" class="part"/><text x="657" y="313" class="name">Ethernet PHY → jack</text><rect x="640" y="370" width="235" height="65" rx="3" fill="#d6e2e4" class="part"/><text x="657" y="408" class="name">microSD storage</text><path d="M560 117 H640" fill="none" stroke="#183e45" stroke-width="3"/><path d="M560 212 H640" fill="none" stroke="#183e45" stroke-width="3"/><path d="M560 307 H640" fill="none" stroke="#183e45" stroke-width="3"/><path d="M560 402 H640" fill="none" stroke="#183e45" stroke-width="3"/><text x="40" y="472" class="small">Linux schedules processes on CPU cores. Drivers operate controllers.</text><text x="40" y="505" class="small">A connector is the physical endpoint of a signal path, not the controller itself.</text></svg>