<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
<title id="title">One-wire SPI0 loopback on Pico 2</title>
<desc id="desc">Signal map, not physical layout. A single external jumper connects SPI0 TX GP19 physical 25 to SPI0 RX GP20 physical 26 on the same Pico. SCK GP18 physical 24 is unconnected externally. USB connects to Mac. Pi and probe are disconnected.</desc>
<rect width="760" height="350" rx="12" fill="#f3f6fb"/>
<g font-family="system-ui,sans-serif" fill="#142c47">
<text x="24" y="33" font-size="21" font-weight="700">Pico 2 • external SPI0 loopback</text>
<text x="24" y="59" font-size="15">Signal map — not a physical header or breadboard layout</text>
<rect x="28" y="89" width="346" height="197" rx="10" fill="#e1ecf4" stroke="#142c47" stroke-width="2"/>
<text x="47" y="117" font-size="19" font-weight="700">RP2350 SPI0 controller</text>
<text x="47" y="154" font-size="17">SCK • GP18 • physical 24</text>
<text x="47" y="202" font-size="17">TX / MOSI • GP19 • physical 25</text>
<text x="47" y="250" font-size="17">RX / MISO • GP20 • physical 26</text>
<path d="M374 148 H407" stroke="#52677b" stroke-width="3"/>
<circle cx="410" cy="148" r="4" fill="white" stroke="#52677b" stroke-width="2"/>
<text x="427" y="153" font-size="16">SCK: leave unconnected</text>
<path d="M374 196 H664 V244 H374" fill="none" stroke="#086c70" stroke-width="5" stroke-linejoin="round"/>
<path d="M390 237 L378 244 L390 251" fill="none" stroke="#086c70" stroke-width="3"/>
<text x="427" y="184" font-size="17" font-weight="700">ONE external jumper</text>
<text x="427" y="274" font-size="16">No CS wire; GP21 unused</text>
<text x="28" y="315" font-size="16">Mac ↔ Pico USB: power + diagnostics • Pi off/disconnected • Probe disconnected</text>
<text x="28" y="338" font-size="14">Keep GP16 LED and GP17 button local circuits; change wires only with Pico unpowered.</text>
</g></svg>
