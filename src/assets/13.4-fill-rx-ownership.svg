<svg xmlns="http://www.w3.org/2000/svg" width="880" height="445" viewBox="0 0 880 445" role="img" aria-labelledby="title desc">
<title id="title">AF_XDP receive-only chunk ownership</title>
<desc id="desc">Conceptual software diagram. Free application chunks are published as offsets on FILL, the kernel copies selected packets and publishes RX descriptors, and the application decodes and recycles chunks. Other packets use ordinary IP and UDP.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315b78"/></marker></defs>
<rect width="880" height="445" rx="12" fill="#f6f8fc"/>
<g font-family="sans-serif" fill="#162c43"><text x="26" y="34" font-size="21" font-weight="bold">Receive-only: one owner per UMEM chunk</text><text x="26" y="60" font-size="15">Conceptual software path • generic XDP + AF_XDP copy • no NIC DMA ring shown</text></g>
<g stroke="#315b78" stroke-width="2" fill="#e8f1f8"><rect x="30" y="105" width="235" height="95" rx="8"/><rect x="325" y="105" width="220" height="95" rx="8"/><rect x="605" y="105" width="245" height="95" rx="8"/><rect x="605" y="265" width="245" height="95" rx="8"/><rect x="325" y="265" width="220" height="95" rx="8"/><rect x="30" y="265" width="235" height="95" rx="8"/></g>
<g font-family="sans-serif" text-anchor="middle" fill="#162c43" font-size="17"><text x="147" y="135" font-weight="bold">Application free pool</text><text x="147" y="163">4096-byte chunks</text><text x="147" y="185">reserve FILL slot</text><text x="435" y="135" font-weight="bold">FILL: offset only</text><text x="435" y="163">submit publishes ownership</text><text x="435" y="185">leave packet bytes alone</text><text x="727" y="135" font-weight="bold">Kernel owns chunk</text><text x="727" y="163">selected queue-0 frame</text><text x="727" y="185">copied into UMEM</text><text x="727" y="295" font-weight="bold">RX: offset + length</text><text x="727" y="323">kernel publishes descriptor</text><text x="727" y="345">application peeks</text><text x="435" y="295" font-weight="bold">Application owns bytes</text><text x="435" y="323">check bounds and owner</text><text x="435" y="345">decode and log sequence</text><text x="147" y="295" font-weight="bold">Recycle chunk</text><text x="147" y="323">release RX descriptor slot</text><text x="147" y="345">replenish FILL separately</text></g>
<g stroke="#315b78" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M265 151H320"/><path d="M545 151H600"/><path d="M728 200V260"/><path d="M605 312H550"/><path d="M325 312H270"/><path d="M147 265V205"/></g>
<g font-family="sans-serif" fill="#162c43" font-size="16"><text x="30" y="403">Nonselected frames / absent socket → XDP_PASS → ordinary IP / UDP endpoint</text><text x="30" y="428">No free FILL chunks → possible loss; RX-slot release alone does not refill the pool.</text></g>
</svg>
