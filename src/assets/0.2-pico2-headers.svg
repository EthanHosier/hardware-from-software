<text x="450" y="796" class="small">21</text><text x="525" y="808">GP16</text><text x="25" y="887" class="small">GP25 is the onboard LED, not a pin in either header row.</text><text x="25" y="918" class="small">Pin mapping checked against official Pico 2 datasheet Figure 2.</text></svg>