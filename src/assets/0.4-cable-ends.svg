<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="t d">
<title id="t">Recognise cable ends</title><desc id="d">Original simplified physical shapes of USB-A, USB-C and micro-B plugs, three-pin SH plug and breakout leads, jumper sockets and pins, microSD card with full-size SD adapter.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#172c45;font-size:18px}.s{font-size:15px}.b{font-weight:700}.metal{fill:#c5cfd7;stroke:#405a71;stroke-width:2}.plastic{fill:#edf2f7;stroke:#405a71;stroke-width:2}.line{fill:none;stroke:#405a71;stroke-width:5}</style>
<rect width="760" height="650" fill="white"/><text x="25" y="32" class="b">Recognise the ends before choosing the cable</text>
<text x="25" y="70">USB plugs — shapes do not prove data capability</text>
<path d="M105 148v45M360 148v45M625 148v45" class="line"/>
<rect x="67" y="95" width="76" height="54" class="metal"/><rect x="80" y="102" width="50" height="11" fill="#405a71"/><rect x="317" y="103" width="86" height="43" rx="21" class="metal"/><rect x="330" y="113" width="60" height="12" rx="6" fill="#405a71"/><path d="M590 145v-29l10-12h50l10 12v29z" class="metal"/><path d="M601 119h48" stroke="#405a71" stroke-width="7"/>
<text x="105" y="223" text-anchor="middle">USB-A</text><text x="360" y="223" text-anchor="middle">USB-C</text><text x="625" y="223" text-anchor="middle">micro-USB (Micro-B)</text>
<path d="M25 247H735" stroke="#a5b4c0"/>
