<svg xmlns="http://www.w3.org/2000/svg" width="860" height="750" viewBox="0 0 860 750" role="img" aria-labelledby="title desc"><title id="title">Conceptual RP2350 internals, not component locations</title><desc id="desc">Within one RP2350 package, a processor complex, SRAM, ROM, peripheral controllers and GPIO selection connect through internal buses. An external flash chip connects through the memory interface; external header pins connect through the GPIO pads. This book runs one Arm core.</desc><style>text{font-family:Arial,sans-serif;fill:#20334a;font-size:21px}.small{font-size:17px}.box{fill:#edf4f8;stroke:#32607b;stroke-width:2}.wire{fill:none;stroke:#32607b;stroke-width:3}</style><rect width="860" height="750" fill="white"/><text x="25" y="35" font-weight="bold">CONCEPTUAL — these blocks are inside one chip</text><rect x="30" y="70" width="800" height="530" rx="15" fill="#f9fbfd" stroke="#233f59" stroke-width="3"/><text x="50" y="102" font-weight="bold">RP2350A package (physical item 5)</text>
<rect x="65" y="135" width="325" height="105" rx="8" class="box"/><text x="80" y="168">Processor complex</text><text x="80" y="198" class="small">Two cores selected from Arm / RISC-V</text><text x="80" y="224" class="small">Book: one Cortex-M33 application core</text>
<rect x="425" y="135" width="170" height="105" rx="8" class="box"/><text x="440" y="173">SRAM</text><text x="440" y="205" class="small">Working data</text><rect x="625" y="135" width="170" height="105" rx="8" class="box"/><text x="640" y="173">Boot ROM</text><text x="640" y="205" class="small">Startup / USB boot</text>
<path d="M227 240V280M510 240V280M710 240V280M80 280H780M230 280V320M645 280V320" class="wire"/><text x="320" y="272" class="small">Internal buses carry addresses and data</text>
<rect x="65" y="320" width="330" height="110" rx="8" class="box"/><text x="80" y="354">Peripheral controllers</text><text x="80" y="384" class="small">UART · I²C · SPI · timers · USB</text><text x="80" y="412" class="small">ADC + internal temperature sensor</text>
<rect x="465" y="320" width="330" height="110" rx="8" class="box"/><text x="480" y="354">Memory interface + cache</text><text x="480" y="387" class="small">Fetch instructions from external flash</text>
<path d="M230 430V470M645 430V640" class="wire"/><rect x="65" y="470" width="500" height="95" rx="8" class="box"/><text x="80" y="503">GPIO selection + electrical pads</text><text x="80" y="536" class="small">Select software GPIO or a permitted peripheral function</text><path d="M230 565V640" class="wire"/>
<rect x="65" y="640" width="330" height="75" rx="8" fill="#fff3d5" stroke="#8e6d23" stroke-width="2"/><text x="80" y="672">External header connections</text><text x="80" y="699" class="small">On the board; not inside RP2350</text><rect x="465" y="640" width="330" height="75" rx="8" fill="#fff3d5" stroke="#8e6d23" stroke-width="2"/><text x="480" y="672">External flash chip · U3</text><text x="480" y="699" class="small">On the board; physical item 4</text></svg>
