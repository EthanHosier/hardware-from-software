<path d="M98 338v50" stroke="#a2acb4" stroke-width="17"/><rect x="58" y="388" width="80" height="35" class="plastic"/>
<g stroke-width="4"><path d="M240 338v53m195-53v53" stroke="#df6519"/><path d="M260 338v53m195-53v53" stroke="#172c45"/><path d="M280 338v53m195-53v53" stroke="#bd9e10"/></g>
<g fill="#253642"><rect x="234" y="391" width="12" height="25"/><rect x="254" y="391" width="12" height="25"/><rect x="274" y="391" width="12" height="25"/></g><g stroke="#a3afb8" stroke-width="5"><path d="M435 391v26m20-26v26m20-26v26"/></g>
<text x="98" y="451" text-anchor="middle" class="s">SH ↔ SH</text><text x="260" y="451" text-anchor="middle" class="s">SH ↔ female sockets</text><text x="455" y="451" text-anchor="middle" class="s">SH ↔ male pins</text>
<text x="555" y="322" class="s">Male: exposed metal pin</text><text x="555" y="349" class="s">Female: receiving socket</text><text x="555" y="389" class="s">Kit jumpers also use</text><text x="555" y="413" class="s">these two end types.</text><text x="555" y="442" class="s">Inspect both ends.</text>
