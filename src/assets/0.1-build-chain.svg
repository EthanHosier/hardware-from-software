<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1120" viewBox="0 0 760 1120" role="img" aria-labelledby="title desc">
<title id="title">The eventual Mac to Pico LED command chain</title>
<desc id="desc">Top to bottom: MacBook laptop, network SSH connection, Raspberry Pi 4 top-view silhouette with header at top and Ethernet and USB at right, UART link, non-wireless Pico 2 top-view silhouette with USB at top, then GPIO through a resistor and LED to ground. The circuit and arrows show functions rather than wiring positions.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#344d68" stroke-width="1.5"/></marker></defs>
<rect width="760" height="1120" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#182c40" font-size="19">
<text x="30" y="34" font-size="24" font-weight="bold">One command, several machines and layers</text>
<text x="30" y="61" font-size="15">Original simplified silhouettes • top views • not to scale • not a wiring guide</text>
<!-- laptop -->
<rect x="65" y="92" width="210" height="125" rx="8" fill="#c8d0da" stroke="#344d68" stroke-width="3"/>
<rect x="77" y="104" width="186" height="99" fill="#203e60"/>
<text x="94" y="146" fill="white" font-family="monospace" font-size="17">$ ssh …</text>
<path d="M65 217H275L303 237H37Z" fill="#b8c2ce" stroke="#344d68" stroke-width="2"/>
<text x="334" y="124" font-size="23" font-weight="bold">MacBook Pro</text>
<text x="334" y="156">Apple silicon runs macOS.</text>
<text x="334" y="187">Editor, build tools, SSH client</text>
<path d="M170 249V311" fill="none" stroke="#344d68" stroke-width="3" marker-end="url(#arrow)"/>
<text x="205" y="280">SSH over the local network</text>
