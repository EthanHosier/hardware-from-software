<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 820" role="img"><title>0.5-parts.svg</title><style>text{font-family:Arial,sans-serif;fill:#172b46;font-size:18px}.title{font-size:24px;font-weight:bold}.small{font-size:15px}.label{font-weight:bold} .wire{fill:none;stroke:#546777;stroke-width:4}</style><rect width="100%" height="100%" fill="#f7f9fc"/><text x="24" y="35" class="title">Select parts by markings and connections</text><text x="24" y="64" class="small">Reference shapes, not an inventory of a particular ELEGOO kit.</text><text x="24" y="108" class="label">7  Axial resistor: two leads, coloured bands</text><path d="M36 157 L375 157" stroke="#8c969f" stroke-width="4" fill="none"/><rect x="100" y="135" width="215" height="44" rx="17" fill="#d6e3e5" stroke="#697c83"/><rect x="122" y="136" width="11" height="42" fill="#784121"/><rect x="158" y="136" width="11" height="42" fill="#181818"/><rect x="194" y="136" width="11" height="42" fill="#d43d27"/><rect x="230" y="136" width="11" height="42" fill="#b8943c"/><text x="400" y="163" class="">1 kΩ, four bands</text><path d="M36 239 L375 239" stroke="#8c969f" stroke-width="4" fill="none"/><rect x="100" y="217" width="215" height="44" rx="17" fill="#d6e3e5" stroke="#697c83"/><rect x="122" y="218" width="11" height="42" fill="#784121"/><rect x="158" y="218" width="11" height="42" fill="#181818"/><rect x="194" y="218" width="11" height="42" fill="#181818"/><rect x="230" y="218" width="11" height="42" fill="#784121"/><rect x="266" y="218" width="11" height="42" fill="#784121"/><text x="400" y="245" class="">1 kΩ, five bands</text><text x="24" y="294" class="small">Read left → right here. Final band = tolerance. Body colour is not the value.</text><text x="24" y="340" class="label">8  Two-lead LED: orientation matters</text><path d="M140 429 V388 a43 43 0 0 1 86 0 V429 Z" fill="#e88a85" stroke="#9d4845" stroke-width="3"/><path d="M134 430 H232 V440 H134 Z" fill="#e88a85" stroke="#9d4845"/><path d="M161 440 L161 543" stroke="#87929e" stroke-width="5" fill="none"/><path d="M207 440 L207 513" stroke="#87929e" stroke-width="5" fill="none"/><text x="44" y="578" class="">Long lead: anode (A)</text><text x="290" y="495" class="">Short lead: cathode (K)</text><text x="290" y="526" class="">Flat rim on cathode side</text><path d="M232 435 L281 518" stroke="#586b7b" stroke-width="3" fill="none"/><text x="24" y="613" class="small">Long/short assumes uncut leads. Check the package drawing if uncertain.</text><text x="24" y="662" class="label">9  Jumper ends: choose the mechanical fit</text><path d="M35 709 L92 709" stroke="#398798" stroke-width="5" fill="none"/><rect x="92" y="697" width="55" height="24" fill="#303946"/><path d="M147 709 L181 709" stroke="#a09a79" stroke-width="5" fill="none"/><text x="209" y="715" class="">Male: exposed metal pin → breadboard hole</text><path d="M35 778 L92 778" stroke="#398798" stroke-width="5" fill="none"/><rect x="92" y="766" width="55" height="24" fill="#303946"/><rect x="145" y="770" width="10" height="16" fill="#111"/><text x="209" y="784" class="">Female: recessed socket → male board header</text><path d="M666 390 A40 40 0 1 0 666 450 Z" fill="#e88a85" stroke="#9d4845" stroke-width="3"/><text x="592" y="370" class="small">Top view of base</text><path d="M666 420 L718 420" stroke="#546777" stroke-width="2"/><text x="724" y="425" class="small">Flat: K</text></svg>