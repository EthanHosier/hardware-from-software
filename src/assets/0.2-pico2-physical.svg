<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1020" viewBox="0 0 1000 1020" role="img" aria-labelledby="title desc">
<title id="title">Pico 2 non-wireless, component side, USB at top</title><desc id="desc">Original simplified physical drawing, checked against the Pico 2 datasheet component-location drawing and schematic. RP2350 at centre, flash above-left, crystal below-left, power regulator above-right, USB top, LED upper-left, BOOTSEL below LED, debug pads bottom. Pin 1 is top-left; pin 40 top-right. A factory-header variant has a debug connector at the same end.</desc>
