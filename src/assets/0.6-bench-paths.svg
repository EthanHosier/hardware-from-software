<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" aria-labelledby="title desc"><title id="title">Staged bench connection plan</title><desc id="desc">Separate USB paths power Pico and Debug Probe. Probe D connects SWCLK, SWDIO and ground to the separately powered Pico. Pi has its own USB-C supply and no GPIO wires at this stage.</desc><style>text{font-family:Arial,sans-serif;fill:#142b3d;font-size:18px} .title{font-size:24px;font-weight:bold} .small{font-size:15px} .wire{fill:none;stroke:#176b95;stroke-width:4} .ground{fill:none;stroke:#333;stroke-width:4}</style><rect width="100%" height="100%" fill="#fff"/><text x="24" y="34" class="title">Power, USB data and debug — staged bench plan</text><rect x="25" y="75" width="190" height="310" rx="12" fill="#e6edf4" stroke="#345"/><text x="50" y="115">Mac USB-C</text><text x="45" y="145" class="small">Data-capable adapter /</text><text x="45" y="166" class="small">hub only if needed</text><rect x="450" y="75" width="210" height="100" rx="8" fill="#d8efdf" stroke="#345"/><text x="470" y="110">Pico 2 USB</text><text x="470" y="140" class="small">Power + load + USB logs</text><path d="M215 125H450" class="wire"/><text x="235" y="107" class="small">USB data cable 1</text><rect x="450" y="270" width="210" height="115" rx="8" fill="#e6edf4" stroke="#345"/><text x="470" y="303">Debug Probe USB</text><text x="470" y="332" class="small">Power + debugger traffic</text><text x="470" y="362" class="small">D socket used; U empty</text><path d="M215 325H450" class="wire"/><text x="235" y="307" class="small">USB data cable 2</text><path d="M660 325H760V125H660" fill="none" stroke="#8c4ba1" stroke-width="4"/><text x="775" y="195" class="small">D → SWD</text><text x="775" y="220" class="small">SWCLK</text><text x="775" y="242" class="small">SWDIO</text><text x="775" y="264" class="small">GND</text><text x="690" y="365" class="small">No target-power contact</text><rect x="25" y="425" width="245" height="65" fill="#f6ecd1" stroke="#345"/><text x="43" y="451">Official Pi 4 supply</text><text x="43" y="474" class="small">Separate USB-C power</text><path d="M270 457H450" class="ground"/><rect x="450" y="425" width="210" height="65" fill="#d8efdf" stroke="#345"/><text x="470" y="452">Pi 4 — later chapters</text><text x="470" y="477" class="small">No GPIO wires yet</text></svg>