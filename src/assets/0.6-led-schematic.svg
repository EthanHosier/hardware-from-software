<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-labelledby="title desc"><title id="title">External LED schematic</title><desc id="desc">GP16 physical pin 21 connects in series through a 1 kiloohm resistor to the LED anode. LED cathode connects to GND physical pin 23.</desc><style>text{font-family:Arial,sans-serif;fill:#142b3d;font-size:18px} .title{font-size:24px;font-weight:bold} .small{font-size:15px} .wire{fill:none;stroke:#176b95;stroke-width:4} .ground{fill:none;stroke:#333;stroke-width:4}</style><rect width="100%" height="100%" fill="#fff"/><text x="25" y="35" class="title">External LED — one series path; Pico 2 only</text><text x="25" y="103">GP16</text><text x="25" y="128" class="small">physical 21</text><path d="M125 145H230" class="wire"/><rect x="230" y="130" width="130" height="30" fill="#f6ecd1" stroke="#333" stroke-width="3"/><text x="240" y="105">R1 = 1 kΩ</text><path d="M360 145H490" class="wire"/><path d="M490 120L535 145L490 170Z M540 117V173" fill="#e26354" stroke="#333" stroke-width="3"/><path d="M540 145H735V200" class="ground"/><path d="M705 200H765 M715 210H755 M725 220H745" class="ground"/><path d="M515 110L540 85M535 112L560 87" stroke="#333" stroke-width="2"/><path d="M532 88L540 85L537 94 M552 90L560 87L557 96" fill="none" stroke="#333" stroke-width="2"/><text x="440" y="205" class="small">A: anode (+)</text><text x="555" y="205" class="small">K: cathode (−)</text><text x="695" y="255">GND</text><text x="680" y="280" class="small">physical 23</text><text x="25" y="320" class="small">When GP16 is high: conventional current → resistor → LED anode → cathode → ground.</text><text x="25" y="346" class="small">A schematic describes electrical connections, not where breadboard holes are located.</text></svg>