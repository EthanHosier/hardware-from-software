<svg xmlns="http://www.w3.org/2000/svg" width="700" height="900" viewBox="0 0 700 900" role="img" aria-labelledby="title desc">
<title id="title">Pi 4 header identity, top view rotated with USB and Ethernet end below</title>
<desc id="desc">All forty physical pins. Odd numbered pins are the left column toward board interior; even numbered pins are the right column toward board edge. Pin one is at the wireless and microSD end. No wires are attached.</desc>
<rect width="700" height="900" fill="#f7fafc"/>
<g font-family="system-ui,sans-serif" fill="#14283e">
<text x="350" y="32" text-anchor="middle" font-size="23" font-weight="bold">Pi 4 — empty 40-pin header</text>
<text x="350" y="60" text-anchor="middle" font-size="16">Top view, rotated: wireless / microSD end above</text>
<text x="110" y="91" font-size="15">Board interior ←</text>
<text x="453" y="91" font-size="15">→ Outer board edge</text>
